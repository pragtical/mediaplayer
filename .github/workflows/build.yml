name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Matching version tag to publish; empty means continuous only"
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate metadata and select release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-release.py
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["addons"][0]["version"])')
          tag="$RELEASE_TAG"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            echo "Release tag must match manifest.json: v$version" >&2
            exit 1
          fi
          build=true
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == branch &&
                -n "$(git tag --points-at HEAD --list "v$version")" ]]; then
            build=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git ca-certificates cmake ninja-build pkg-config \
            python3 python3-venv nasm libasound2-dev libpulse-dev \
            autoconf automake libtool
      - uses: actions/checkout@v7.0.1
      - name: Python build tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install meson jinja2
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build minimal runtime
        run: python3 scripts/build.py --arch '${{ matrix.arch }}'
      - name: Check runtime and release files
        run: |
          python3 scripts/check-runtime.py 'dist/mpv.${{ matrix.arch }}.so'
          python3 scripts/check-release.py dist --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mediaplayer-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64-darwin
          - runner: macos-15-intel
            arch: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build dependencies
        run: |
          brew install cmake ninja nasm pkgconf
          python3 -m venv .venv
          .venv/bin/pip install meson jinja2
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build minimal runtime
        run: python3 scripts/build.py --arch '${{ matrix.arch }}'
      - name: Check runtime and release files
        run: |
          python3 scripts/check-runtime.py 'dist/mpv.${{ matrix.arch }}.so'
          python3 scripts/check-release.py dist --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mediaplayer-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-python-jinja
            mingw-w64-ucrt-x86_64-nasm
      - name: Build minimal runtime
        run: python scripts/build.py --arch x86_64-windows
      - name: Check runtime and release files
        run: |
          python scripts/check-runtime.py dist/mpv.x86_64-windows.dll
          python scripts/check-release.py dist --arch x86_64-windows
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mediaplayer-x86_64-windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, linux, macos, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mediaplayer-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: mediaplayer-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete release
        run: |
          python3 scripts/check-release.py artifacts --checksums artifacts/SHA256SUMS
      - name: Publish native runtimes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(artifacts/*.so artifacts/*.dll \
                  artifacts/*.json artifacts/SHA256SUMS)
          publish() {
            local tag="$1" title="$2" prerelease="$3"
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq sources.tar.gz; then
                gh release delete-asset "$tag" sources.tar.gz --yes
              fi
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --title "$title" --notes-file release-notes.md \
                --prerelease="$prerelease"
            else
              gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
                --title "$title" --notes-file release-notes.md --prerelease="$prerelease"
            fi
          }
          cat > release-notes.md <<EOF
          Minimal libmpv runtimes for Pragtical Media Player, built from $GITHUB_SHA.

          PPM downloads the runtime for your platform. License notices are in the repository's licenses directory.
          Manual installs put the library beside plugins/mediaplayer/init.lua.
          Pinned dependency sources, build scripts and local patches are available in this repository.
          EOF
          if [[ -n "$RELEASE_TAG" ]]; then
            publish "$RELEASE_TAG" "$RELEASE_TAG" false
            git push --force origin "$GITHUB_SHA:refs/tags/latest"
            publish latest latest false
            git push --force origin "$GITHUB_SHA:refs/heads/latest"
          fi
          git push --force origin "$GITHUB_SHA:refs/tags/continuous"
          publish continuous 'Continuous Release' true
